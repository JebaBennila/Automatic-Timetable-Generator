<!DOCTYPE html>
<html>

<head>
    <title>Automatic Timetable Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        <h1>Automatic Timetable Generator</h1>
        <p>Create a weekly college timetable with simple scheduling constraints</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>Add Subjects</h2>

            <div class="input-section">

                <input type="text" id="subjectInput"
                    placeholder="Enter subject name">

                <input type="number" id="periodInput"
                    placeholder="Periods / Week" min="1" max="40">

                <button onclick="addSubject()">Add Subject</button>

            </div>

            <div id="message"></div>

            <div id="subjectList"></div>

        </div>


        <div class="card">

            <h2>Weekly Requirements</h2>

            <div class="requirement">
                <span>Working Days</span>
                <strong>5 Days</strong>
            </div>

            <div class="requirement">
                <span>Periods Per Day</span>
                <strong>8 Periods</strong>
            </div>

            <div class="requirement">
                <span>Total Weekly Periods</span>
                <strong>40 Periods</strong>
            </div>

        </div>


        <div class="actions">

            <button class="generate" onclick="generateTimetable()">
                Generate Timetable
            </button>

            <button class="clear" onclick="clearAll()">
                Clear All
            </button>

        </div>


        <div class="card">

            <h2>Generated Timetable</h2>

            <div id="timetable">
                <p class="empty">Add subjects and generate your timetable.</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
